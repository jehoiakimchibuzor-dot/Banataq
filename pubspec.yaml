name: banataq
description: "Banataq is an AI assistant for learning, writing, ideas, and everyday problem-solving."
publish_to: 'none'
version: 1.0.0+2

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_bloc: ^9.1.1
  equatable: ^2.1.0

  # Firebase
  firebase_core: ^4.12.1
  firebase_auth: ^6.5.6
  cloud_firestore: ^6.7.1
  firebase_storage: ^13.4.5

  # Authentication
  google_sign_in: ^7.2.0
  crypto:

  # Local storage
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^9.2.4
  file_picker: ^10.2.0

  # Connectivity
  connectivity_plus: ^7.3.1

  # Dependency injection
  get_it: ^9.2.1

  # UI
  cached_network_image: ^3.4.1
  image_picker: ^1.2.3
  video_player: ^2.9.2

  # Markdown
  flutter_markdown: ^0.7.7
  markdown: ^7.3.1

  # Utilities
  intl: ^0.20.3
  uuid: ^4.6.0
  http: ^1.6.0
  url_launcher: ^6.2.5
  flutter_lints: ^6.0.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter

# Pin path_provider_android to the last version before the JNI rewrite.
# Newer versions (2.3.0+) depend on package:jni which is incompatible with
# the AGP 9.0.1 / Gradle 9.1.0 toolchain this project uses.
dependency_overrides:
  path_provider_android: 2.2.23

flutter:
  uses-material-design: true
  assets:
    - assets/onboarding/
