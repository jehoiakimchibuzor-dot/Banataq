name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validate (analyze + tests + rules)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17 (for Android/Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.1'
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Dart analyze lib
        run: dart analyze lib --fatal-infos --fatal-warnings

      - name: Dart analyze test
        run: dart analyze test --fatal-infos --fatal-warnings

      - name: Flutter tests
        run: flutter test --no-pub

      - name: Setup Node 20 (for Firebase rules tests)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install Node dependencies (clean)
        run: npm ci

      - name: Install Firebase CLI
        run: npm i -g firebase-tools

      - name: Firestore rules tests (emulator)
        run: npx firebase emulators:exec --only firestore "npx mocha firestore.rules.test.js --timeout 20000"

      - name: Storage rules tests (emulator)
        run: npx firebase emulators:exec --only storage "npx mocha storage.rules.test.js --timeout 20000"

      - name: Combined rules tests (firestore + storage)
        # Also proves the combined script from package.json works
        run: npm run test:rules

  build-release:
    name: Build Android App Bundle (release)
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 30
    # Only build release artifact on main pushes, not on every PR (still validates)
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.1'
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Decode keystore and create key.properties (if secrets present)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Creating release keystore from secrets..."
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
            printf "storeFile=upload-keystore.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n" "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > android/key.properties
            echo "key.properties created:"
            cat android/key.properties | sed 's/storePassword=.*/storePassword=***redacted***/' | sed 's/keyPassword=.*/keyPassword=***redacted***/'
          else
            echo "No KEYSTORE_BASE64 secret found — release build will fail with clear Gradle error."
            echo "See android/key.properties.example and docs/RELEASE_CHECKLIST.md for required secrets."
            echo "This is expected for PRs without release secrets; validate job must still pass."
          fi

      - name: Build App Bundle (release)
        run: |
          echo "=== Flutter build appbundle --release ==="
          echo "Dart compilation..."
          flutter build appbundle --release --verbose 2>&1 | tee build.log
          echo "=== Build finished ==="
          ls -lh build/app/outputs/bundle/release/*.aab || echo "No AAB found — check build.log for Gradle/Kotlin/signing errors"
          echo "=== Build log tail ==="
          tail -n 100 build.log || true

      - name: Upload AAB artifact (if built)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: banataq-release-aab
          path: build/app/outputs/bundle/release/*.aab
          if-no-files-found: warn

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: warn

  # Separate job for Firebase deploy — only on manual workflow_dispatch with environment protection
  # To enable, create a GitHub Environment "production" with required reviewers and add secrets:
  #   FIREBASE_SERVICE_ACCOUNT (JSON) or FIREBASE_TOKEN
